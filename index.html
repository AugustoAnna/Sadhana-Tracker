    <title>Sadhana Tracker</title>
    <script>
      // Apply the theme before first paint, so dark mode (the default) doesn't flash light.
      // Mirrors applyUrlSwitch()/readTheme() in src/services/theme.ts, which takes over once the app loads.
      (function () {
        var theme = null;
        try {
          var param = new URLSearchParams(location.search).get('theme');
          if (param === 'dark' || param === 'light') localStorage.setItem('theme-override', param);
          theme = localStorage.getItem('theme-override');
        } catch (e) {}
        if (theme !== 'light') {
          document.documentElement.dataset.theme = 'dark';
          // A fresh tag, not an edited one: Android only repaints its status bar for a new tag.
          var meta = document.createElement('meta');
          meta.name = 'theme-color';
          meta.content = '#141311';
          document.querySelector('meta[name="theme-color"]').replaceWith(meta);
        }
      })();
    </script>
