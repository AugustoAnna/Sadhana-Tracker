<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0D8A7A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <title>Sadhana Tracker</title>
    <script>
      // Pick the theme before first paint so evenings don't flash white.
      // Mirrors readOverride()/resolveTheme() in src/services/theme.ts, which takes over once the app loads.
      (function () {
        var override = null;
        try {
          var param = new URLSearchParams(location.search).get('theme');
          if (param === 'dark' || param === 'light') localStorage.setItem('theme-override', param);
          else if (param === 'auto') localStorage.removeItem('theme-override');
          override = localStorage.getItem('theme-override');
        } catch (e) {}
        var h = new Date().getHours();
        var dark = override === 'dark' || (override !== 'light' &&
          (h >= 18 || h < 6 || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)));
        if (dark) {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#141311');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
